# Docker Compose for ExpenseTracker Backend
# For local development and testing

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expensetracker-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server Configuration
      PORT: 3000
      NODE_ENV: production
      
      # Database Configuration (using volume-mounted SQLite)
      DB_PATH: file:/app/data/expense-tracker.db
      
      # Logging Configuration
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      
      # Security
      CORS_ORIGIN: "*"
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # API Configuration
      DEFAULT_PAGE_SIZE: 10
      MAX_PAGE_SIZE: 100
      
      # JWT Secrets (CHANGE THESE IN PRODUCTION!)
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      
      # Email Configuration (optional, for password reset)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@expensetracker.com}
    
    volumes:
      # Persist database and logs
      - ./data:/app/data
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  logs:
