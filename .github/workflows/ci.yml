name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  NODE_VERSION: '20'
  DOCKER_IMAGE_NAME: expensetracker-api

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting with Prettier
        run: npx prettier --check "**/*.{ts,json,md}"

  # Job 2: Type Checking
  type-check:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

  # Job 3: Unit and Integration Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit and integration tests
        run: npm test -- --coverage=false

      - name: Generate test coverage report
        run: npm run test:coverage -- --coverageThreshold='{}'
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 4: Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality, type-check, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript application
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          if [ ! -f "build/src/index.js" ]; then
            echo "Main entry file not found in build/src/!"
            exit 1
          fi
          echo "Build artifacts verified successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/
            package*.json
            prisma/
          retention-days: 7

  # Job 5: Build Docker Image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker image
        run: |
          # Start container in detached mode
          docker run -d \
            --name test-container \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DB_PATH=file:./data/expense.db \
            -e JWT_SECRET=test-secret-for-ci-only-32chars \
            -e JWT_REFRESH_SECRET=test-refresh-secret-for-ci \
            -e JWT_EXPIRES_IN=15m \
            -e JWT_REFRESH_EXPIRES_IN=7d \
            -e CORS_ORIGIN=* \
            -e RATE_LIMIT_WINDOW_MS=900000 \
            -e RATE_LIMIT_MAX_REQUESTS=100 \
            -p 3000:3000 \
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          
          # Wait for container to start
          echo "Waiting for container to start..."
          sleep 15
          
          # Check container status
          docker ps -a
          
          # Check container logs
          echo "Container logs:"
          docker logs test-container
          
          # Test health endpoint
          echo "Testing health endpoint..."
          for i in {1..10}; do
            if curl -f http://localhost:3000/health; then
              echo "Health check passed!"
              docker stop test-container
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          
          echo "Health check failed after 10 attempts"
          docker logs test-container
          docker stop test-container
          exit 1

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 6: Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          if [ -f audit-report.json ]; then
            echo "Audit report generated"
            cat audit-report.json
          fi

  # Job 7: Summary
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [code-quality, type-check, test, build, docker-build, security-audit]
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "- Code quality: ✅"
          echo "- Type checking: ✅"
          echo "- Tests: ✅"
          echo "- Build: ✅"
          echo "- Docker build: ✅"
          echo "- Security audit: ✅"
