<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker API Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .section { margin-bottom: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin: 10px 0; padding: 5px 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Expense Tracker API Test</h1>

    <div class="section">
        <h2>Create Expense</h2>
        <button onclick="createExpense()">Create Sample Expense</button>
        <pre id="createResult"></pre>
    </div>

    <div class="section">
        <h2>Get All Expenses</h2>
        <button onclick="getAllExpenses()">Get All Expenses</button>
        <pre id="getAllResult"></pre>
    </div>

    <div class="section">
        <h2>Get Expense by ID</h2>
        <input type="number" id="expenseId" placeholder="Enter expense ID">
        <button onclick="getExpenseById()">Get Expense</button>
        <pre id="getByIdResult"></pre>
    </div>

    <div class="section">
        <h2>Get Expenses by Category</h2>
        <button onclick="getExpensesByCategory()">Get Category Totals</button>
        <pre id="categoryResult"></pre>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function createExpense() {
            const expense = {
                name: 'Grocery Shopping',
                amount: 150.75,
                currency: 'USD',
                category: 'Food'
            };

            try {
                const response = await fetch(`${API_URL}/expenses`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(expense)
                });
                const data = await response.json();
                document.getElementById('createResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('createResult').textContent = `Error: ${error.message}`;
            }
        }

        async function getAllExpenses() {
            try {
                const response = await fetch(`${API_URL}/expenses`);
                const data = await response.json();
                document.getElementById('getAllResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('getAllResult').textContent = `Error: ${error.message}`;
            }
        }

        async function getExpenseById() {
            const id = document.getElementById('expenseId').value;
            try {
                const response = await fetch(`${API_URL}/expenses/${id}`);
                const data = await response.json();
                document.getElementById('getByIdResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('getByIdResult').textContent = `Error: ${error.message}`;
            }
        }

        async function getExpensesByCategory() {
            try {
                const response = await fetch(`${API_URL}/expenses/stats/category`);
                const data = await response.json();
                document.getElementById('categoryResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('categoryResult').textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
